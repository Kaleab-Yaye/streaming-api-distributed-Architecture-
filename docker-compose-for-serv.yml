
services:
  perm-volume-fix-init:
    image: busybox
    container_name: fix_init
    user: "0:0"
    volumes:
      - vid_store:/vid_store
      - temp_upload:/temp_upload
    command: sh -c "chown -R :1000 /temp_upload /vid_store && chmod -R 775 /temp_upload /vid_store"
    restart: "no"


  api:
    image:  ghcr.io/kaleab-yaye/api
    container_name: stream
    ports:
      - "8080:8080"
    depends_on:
      - postgres


  encoder:
    container_name: encoder
    image: ghcr.io/kaleab-yaye/encoder
    user: "1000:1000"
    depends_on:
      - perm-volume-fix-init
      - api
      - nginx
      - postgres
    environment:
      - RAW_VID=/data
      - PROC_ED=/encoded
    volumes:
      - temp_upload:/data
      - vid_store:/encoded

  postgres:
    image: postgres:15-alpine
    container_name: db
    environment:
      - POSTGRES_USER=devuser # psql -d streaming_api_db -U devuser
      - POSTGRES_PASSWORD=devsecret
      - POSTGRES_DB=streaming_api_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/log:/var/log/postgresql
    entrypoint:
      - bash
      - -c
      - |
        chown -R postgres:postgres /var/log/postgresql
        exec docker-entrypoint.sh "$$@"
      - "--"

    command:
      - "postgres"
      - "-c"
      - "logging_collector=on"
      - "-c"
      - "log_directory=/var/log/postgresql"
      - "-c"
      - "log_filename=postgres-%Y-%m-%d.log"
      - "-c"
      - "log_rotation_age=1d"
      - "-c"
      - "log_rotation_size=10MB"

  nginx:
    image: nginx:alpine
    container_name: streaming_proxy
    ports:
      - "80:80"
    depends_on:
      - api
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - vid_store:/store/videos/encoded/:ro
      - test_html:/store/html:ro

  tusd:
    image: tusproject/tusd:sha-262f655
    container_name: tus-serv
    ports:
      - "1080:1080"
    volumes:
      - temp_upload:/srv/tusd-data
    user: "1001:1000"
    command: >
      -host=0.0.0.0
      -port=1080
      -upload-dir=/srv/tusd-data
      -hooks-http=http://api:8080/api/hooks/tusd/upload
      -hooks-http-retry=3
      -
    depends_on:
      - api
      - perm-volume-fix-init

volumes:
  pgdata:
  vid_store:
  test_html:
  temp_upload: