
services:

  api:
    build: .
    image: api
    container_name: stream
    ports:
      - "8080:8080"
    depends_on:
      - postgres


  encoder:
    build:
      context: ../..
      dockerfile: ../../Dockerfile.encode
    container_name: encoder
    image: encoder
    depends_on:
      - api
      - nginx
      - postgres
    environment:
      - RAW_VID=/data
      - PROC_ED=/encoded
    volumes:
      - temp_upload:/data
      - vid_store:/encoded
      
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=devuser # psql -d streaming_api_db -U devuser
      - POSTGRES_PASSWORD=devsecret
      - POSTGRES_DB=streaming_api_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./DBLogFiles:/var/log/postgresql

    command:
      - "postgres"
      - "-c"
      - "logging_collector=on"
      - "-c"
      - "log_directory=/var/log/postgresql"
      - "-c"
      - "log_filename=postgres-%Y-%m-%d.log"
      - "-c"
      - "log_rotation_age=1d"
      - "-c"
      - "log_rotation_size=10MB"

  nginx:
    image: nginx:alpine
    container_name: streaming_proxy
    ports:
      - "80:80"
    depends_on:
      - api
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - vid_store:/store/videos/encoded/
      - test_html:/store/html

  tusd:
    image: tusproject/tusd:sha-262f655
    container_name: tus-serv
    ports:
      - "1080:1080"
    volumes:
      - temp_upload:/srv/tusd-data
    command: >
      -host=0.0.0.0 
      -port=1080 
      -upload-dir=/srv/tusd-data
      -hooks-http=http://api:8080/api/hooks/tusd/upload
      -hooks-http-retry=3
    depends_on:
      - api


volumes:
  pgdata:
  vid_store:
  test_html:
  temp_upload:
