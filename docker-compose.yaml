services:

  perm-volume-fix-init:
      image: busybox
      container_name: fix_init
      user: "0:0"
      volumes:
        - s3_store:/s3_store
      command: sh -c "chown -R 1000:1000 /s3_store && chmod -R 775 /s3_store"
      restart: "no"

  minio:
      container_name: S3_Store
      image: quay.io/minio/minio:latest
      command: server /data --console-address ":9001"
      user: "1000:1000"
      environment:
        MINIO_ROOT_USER: ktadmin
        MINIO_ROOT_PASSWORD: 12345678
      volumes:
        - s3_store:/data
      ports:
        - "9000:9000"
        - "9001:9001"

  api:
    build: .
    image: api
    container_name: stream_dist
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    volumes:
      - temp_upload:/app/temp_upload
    environment:
      - TEMP_UPLOAD=./temp_upload
      - S3_URI=http://minio:9000
      - S3_ACCESS_KEY=ktadmin
      - S3_SECRET_ACCESS_KEY=12345678


  encoder:
      build:
        context: .
        dockerfile: Dockerfile.encode
      container_name: encoder-dist
      image: encoder
      depends_on:
        - api
        - nginx
        - postgres
      environment:
        - RAW_VID=/data
        - PROC_ED=/encoded
        - S3_URI=http://minio:9000
        - S3_ACCESS_KEY=ktadmin
        - S3_SECRET_ACCESS_KEY=12345678
        - CENTERAL_CERV=http://api
        - MECH_NUMBER=1

  stream-node:
    build:
      context: .
      dockerfile: Dockerfile.stream
    container_name: stream_node
    image: stream-node
    depends_on:
      - api
      - nginx
      - postgres
    environment:
      - RAW_VID=/data
      - PROC_ED=/encoded
      - S3_URI=http://minio:9000
      - S3_ACCESS_KEY=ktadmin
      - S3_SECRET_ACCESS_KEY=12345678
      - CENTERAL_CERV=http://api
      - MECH_NUMBER=2
    volumes:
    - stream_store:/stream/store
    ports:
      - "8000:8000"



  go-node:
    build:
      context: .
      dockerfile: /Docker/GO_NODE_DOCKER_FILES/DockerFile.gonode
    container_name: go_node
    image: go-node-image
    ports:
      - "3002:3002"
    environment:
      END_POINT: "minio:9000"
      ACCESS_kEY: "ktadmin"
      SECRET_ACCESS_KEY: "12345678"
      SSL_USE: "false"
    volumes:
      - go_node_store:/stream





  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=devuser # psql -d streaming_api_db -U devuser
      - POSTGRES_PASSWORD=devsecret
      - POSTGRES_DB=streaming_api_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./DBLogFiles:/var/log/postgresql

    command:
      - "postgres"
      - "-c"
      - "logging_collector=on"
      - "-c"
      - "log_directory=/var/log/postgresql"
      - "-c"
      - "log_filename=postgres-%Y-%m-%d.log"
      - "-c"
      - "log_rotation_age=1d"
      - "-c"
      - "log_rotation_size=10MB"


  nginx:
    image: nginx:alpine
    container_name: streaming_proxy_dist
    ports:
      - "80:80"
    depends_on:
      - api
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - test_html:/store/html
      - stream_store:/store/videos/encoded/


  tusd:
    image: tusproject/tusd:sha-262f655
    container_name: tus-serv-dist_dist
    ports:
      - "1080:1080"
    volumes:
      - temp_upload:/srv/tusd-data
    command: >
      -host=0.0.0.0 
      -port=1080 
      -upload-dir=/srv/tusd-data
      -hooks-http=http://api:8080/api/hooks/tusd/upload
      -hooks-http-retry=3
    depends_on:
      - api




volumes:
  pgdata:
  test_html:
  temp_upload:
  s3_store:
  stream_store:
  go_node_store:
